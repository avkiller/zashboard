name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # ============================================================
  # 1. 创建 Release Job（简化版）
  # ============================================================
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_created: ${{ steps.version.outputs.release_created }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version and check tag
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$VERSION"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "release_created=false" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG_NAME already exists, skipping release creation"
          else
            echo "release_created=true" >> $GITHUB_OUTPUT
            echo "✅ Tag $TAG_NAME does not exist, will create release"
          fi

  # ============================================================
  # 2. 构建并部署到 gh-pages
  # ============================================================
  build-and-deploy:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        font:
          - { key: all, suffix: '' }
          # - { key: cdn, suffix: '-cdn-fonts' }
          # - { key: firasans, suffix: '-firasans-only' }
          # - { key: misans, suffix: '-misans-only' }
          # - { key: pingfang, suffix: '-pingfang-only' }
          # - { key: sarasa, suffix: '-sarasa-only' }
          - { key: none, suffix: '-no-fonts' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - uses: pnpm/action-setup@v6

      - name: Install and Build 🔧
        env:
          FONT: ${{ matrix.font.key }}
        run: |
          pnpm i
          pnpm run build
          echo 'board.zash.run.place' > ./dist/CNAME

      - name: Deploy 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages${{ matrix.font.suffix }}
          force_orphan: true

  # ============================================================
  # 3. 打包并上传到 Release
  # ============================================================
  release-dist:
    needs: create-release
    runs-on: ubuntu-latest
    # if: ${{ needs.create-release.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        font:
          - { key: all, suffix: '-gh-pages' }
          # - { key: cdn, suffix: '-cdn-fonts' }
          # - { key: firasans, suffix: '-firasans-only' }
          # - { key: misans, suffix: '-misans-only' }
          # - { key: pingfang, suffix: '-pingfang-only' }
          # - { key: sarasa, suffix: '-sarasa-only' }
          - { key: none, suffix: '-no-fonts' }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
      - uses: pnpm/action-setup@v6

      - name: Build and Zip the dist folder
        env:
          FONT: ${{ matrix.font.key }}
        run: |
          pnpm i
          pnpm run build
          zip -r zashboard${{ matrix.font.suffix }}.zip dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: zashboard${{ matrix.font.suffix }}.zip
          tag_name: ${{ needs.create-release.outputs.tag_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
